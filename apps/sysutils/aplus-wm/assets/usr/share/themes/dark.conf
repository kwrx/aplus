# aplus dark: hueless greys a shade apart, with one blue accent: deep where it carries white text, bright where it marks.
#
# Colours are #RRGGBB or #RRGGBBAA, or #RRGGBB followed by an alpha from 0 to 1.
# Anything left out keeps the built-in value.

[ui]
background     = #2B2B2B
surface        = #343434
surface_sunken = #1C1C1C
primary        = #1B6ACA
on_primary     = #FFFFFF
secondary      = #3A3A3A
on_secondary   = #EEEEEE
danger         = #C9363C
on_danger      = #FFFFFF
hover          = #FFFFFF 0.07
active         = #FFFFFF 0.14
border         = #FFFFFF 0.07
focus_ring     = #3584E4
text           = #EEEEEE
text_muted     = #9A9A9A
disabled_fade  = 0.55
corner_radius  = 8
font_size      = 14
font_regular   = /usr/share/fonts/ttf/NotoSans-Regular.ttf
font_medium    = /usr/share/fonts/ttf/NotoSans-Medium.ttf
font_bold      = /usr/share/fonts/ttf/NotoSans-Bold.ttf
font_mono      = /usr/share/fonts/ttf/JetBrainsMono-Regular.ttf
font_mono_bold = /usr/share/fonts/ttf/JetBrainsMono-Bold.ttf
font_mono_size = 14

[wm]
wallpaper      = /usr/share/images/aplus-dark.webp
desktop_top    = #161616
desktop_bottom = #0B0B0B
title_active   = #EEEEEE
title_idle     = #969696
outline        = #000000 0.55
highlight      = #FFFFFF 0.10
highlight_idle = #FFFFFF 0.05
button         = #FFFFFF 0.07
button_over    = #FFFFFF 0.16
button_down    = #FFFFFF 0.24
close_over     = #E5484D
close_down     = #BD3238
accent         = #3584E4
taskbar        = #121212
taskbar_hover  = #FFFFFF 0.07
taskbar_active = #FFFFFF 0.11
taskbar_down   = #FFFFFF 0.16
taskbar_mark   = #999999 0.70
taskbar_power  = #E5484D
taskbar_edge   = #FFFFFF 0.08
shadow_key     = 0.42
shadow_ambient = 0.30
taskbar_shadow = 0.60
font           = /usr/share/fonts/ttf/NotoSans-Regular.ttf
font_size      = 14
