# dusk: generated by scripts/gen-themes from 05.webp, with its greys tinted towards the
# picture's most colourful hue (Oklch 265°). Run it again rather than editing this file.
#
# Colours are #RRGGBB or #RRGGBBAA, or #RRGGBB followed by an alpha from 0 to 1.
# [ui] and [wm] hold what both variants share; [dark.*] and [light.*] what each sets apart.

[ui]
on_primary     = #FFFFFF
on_danger      = #FFFFFF
disabled_fade  = 0.55
corner_radius  = 8
font_size      = 14
font_regular   = /usr/share/fonts/ttf/NotoSans-Regular.ttf
font_medium    = /usr/share/fonts/ttf/NotoSans-Medium.ttf
font_bold      = /usr/share/fonts/ttf/NotoSans-Bold.ttf
font_mono      = /usr/share/fonts/ttf/JetBrainsMono-Regular.ttf
font_mono_bold = /usr/share/fonts/ttf/JetBrainsMono-Bold.ttf
font_mono_size = 14

[wm]
wallpaper      = /usr/share/images/05.webp
desktop_top    = #98A4C1
desktop_bottom = #4F5886
taskbar_shadow = 0.60
font           = /usr/share/fonts/ttf/NotoSans-Regular.ttf
font_size      = 14

[dark.ui]
background     = #282B31
surface        = #31343A
surface_sunken = #191C22
primary        = #385CB2
secondary      = #383C43
on_secondary   = #ECEEF3
danger         = #C9363C
hover          = #FFFFFF 0.07
active         = #FFFFFF 0.14
border         = #FFFFFF 0.07
focus_ring     = #6790EB
text           = #ECEEF3
text_muted     = #A1A5AC

[dark.wm]
title_active   = #ECEEF3
title_idle     = #8F929A
close_over     = #E5484D
close_down     = #BD3238
accent         = #6790EB
taskbar        = #111419
taskbar_power  = #E5484D
outline        = #000000 0.55
highlight      = #FFFFFF 0.10
highlight_idle = #FFFFFF 0.05
button         = #FFFFFF 0.07
button_over    = #FFFFFF 0.16
button_down    = #FFFFFF 0.24
taskbar_hover  = #FFFFFF 0.07
taskbar_active = #FFFFFF 0.11
taskbar_down   = #FFFFFF 0.16
taskbar_mark   = #999999 0.70
taskbar_edge   = #FFFFFF 0.08
shadow_key     = 0.42
shadow_ambient = 0.30

[light.ui]
background     = #F4F6FA
surface        = #FDFDFF
surface_sunken = #FDFDFF
primary        = #4C72CA
secondary      = #E1E4EB
on_secondary   = #1C1E23
danger         = #D93B41
hover          = #000000 0.06
