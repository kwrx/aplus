# lagoon: generated by scripts/gen-themes from 01.webp, with its greys tinted towards the
# picture's most colourful hue (Oklch 227°). Run it again rather than editing this file.
#
# Colours are #RRGGBB or #RRGGBBAA, or #RRGGBB followed by an alpha from 0 to 1.
# [ui] and [wm] hold what both variants share; [dark.*] and [light.*] what each sets apart.

[ui]
on_primary     = #FFFFFF
on_danger      = #FFFFFF
disabled_fade  = 0.55
corner_radius  = 8
font_size      = 14
font_regular   = /usr/share/fonts/ttf/NotoSans-Regular.ttf
font_medium    = /usr/share/fonts/ttf/NotoSans-Medium.ttf
font_bold      = /usr/share/fonts/ttf/NotoSans-Bold.ttf
font_mono      = /usr/share/fonts/ttf/JetBrainsMono-Regular.ttf
font_mono_bold = /usr/share/fonts/ttf/JetBrainsMono-Bold.ttf
font_mono_size = 14

[wm]
wallpaper      = /usr/share/images/01.webp
desktop_top    = #518399
desktop_bottom = #497D93
taskbar_shadow = 0.60
font           = /usr/share/fonts/ttf/NotoSans-Regular.ttf
font_size      = 14

[dark.ui]
background     = #262C2F
surface        = #2F3538
surface_sunken = #171D1F
primary        = #016989
secondary      = #363D41
on_secondary   = #EBEFF1
danger         = #C9363C
hover          = #FFFFFF 0.07
active         = #FFFFFF 0.14
border         = #FFFFFF 0.07
focus_ring     = #339EC5
text           = #EBEFF1
text_muted     = #9EA6A9

[dark.wm]
title_active   = #EBEFF1
title_idle     = #8C9497
close_over     = #E5484D
close_down     = #BD3238
accent         = #339EC5
taskbar        = #0F1517
taskbar_power  = #E5484D
outline        = #000000 0.55
highlight      = #FFFFFF 0.10
highlight_idle = #FFFFFF 0.05
button         = #FFFFFF 0.07
button_over    = #FFFFFF 0.16
button_down    = #FFFFFF 0.24
taskbar_hover  = #FFFFFF 0.07
taskbar_active = #FFFFFF 0.11
taskbar_down   = #FFFFFF 0.16
taskbar_mark   = #999999 0.70
taskbar_edge   = #FFFFFF 0.08
shadow_key     = 0.42
shadow_ambient = 0.30

[light.ui]
