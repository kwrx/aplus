# default: hueless greys a shade apart, with one blue accent. Dark is deep where it carries white
# text and bright where it marks; light is white surfaces on a soft grey with a deeper blue.
#
# Colours are #RRGGBB or #RRGGBBAA, or #RRGGBB followed by an alpha from 0 to 1.
# [ui] and [wm] hold what both variants share; [dark.*] and [light.*] what each sets apart.
# Anything left out keeps the built-in value.

[ui]
on_primary     = #FFFFFF
on_danger      = #FFFFFF
disabled_fade  = 0.55
corner_radius  = 8
font_size      = 14
font_regular   = /usr/share/fonts/ttf/NotoSans-Regular.ttf
font_medium    = /usr/share/fonts/ttf/NotoSans-Medium.ttf
font_bold      = /usr/share/fonts/ttf/NotoSans-Bold.ttf
font_mono      = /usr/share/fonts/ttf/JetBrainsMono-Regular.ttf
font_mono_bold = /usr/share/fonts/ttf/JetBrainsMono-Bold.ttf
font_mono_size = 14

[wm]
taskbar_shadow = 0.60
font           = /usr/share/fonts/ttf/NotoSans-Regular.ttf
font_size      = 14

[dark.ui]
background     = #2B2B2B
surface        = #343434
surface_sunken = #1C1C1C
primary        = #1B6ACA
secondary      = #3A3A3A
on_secondary   = #EEEEEE
danger         = #C9363C
hover          = #FFFFFF 0.07
active         = #FFFFFF 0.14
border         = #FFFFFF 0.07
focus_ring     = #3584E4
text           = #EEEEEE
text_muted     = #9A9A9A

[dark.wm]
wallpaper      = /usr/share/images/aplus-dark.webp
desktop_top    = #161616
desktop_bottom = #0B0B0B
title_active   = #EEEEEE
title_idle     = #969696
outline        = #000000 0.55
highlight      = #FFFFFF 0.10
highlight_idle = #FFFFFF 0.05
button         = #FFFFFF 0.07
button_over    = #FFFFFF 0.16
button_down    = #FFFFFF 0.24
close_over     = #E5484D
close_down     = #BD3238
accent         = #3584E4
taskbar        = #121212
taskbar_hover  = #FFFFFF 0.07
taskbar_active = #FFFFFF 0.11
taskbar_down   = #FFFFFF 0.16
taskbar_mark   = #999999 0.70
taskbar_power  = #E5484D
taskbar_edge   = #FFFFFF 0.08
shadow_key     = 0.42
shadow_ambient = 0.30

[light.ui]
background     = #F6F6F6
surface        = #FFFFFF
surface_sunken = #FFFFFF
primary        = #2A72DA
secondary      = #E4E4E4
on_secondary   = #1D1D1D
danger         = #D93B41
hover          = #000000 0.06
active         = #000000 0.10
border         = #000000 0.11
focus_ring     = #2A72DA
text           = #1D1D1D
text_muted     = #6B6B6B

[light.wm]
wallpaper      = /usr/share/images/aplus-light.webp
desktop_top    = #A9C4EA
desktop_bottom = #7FA6DA
title_active   = #1D1D1D
title_idle     = #6E6E6E
outline        = #000000 0.16
highlight      = #FFFFFF 0.85
highlight_idle = #FFFFFF 0.45
button         = #000000 0.05
button_over    = #000000 0.10
button_down    = #000000 0.16
close_over     = #D93B41
close_down     = #BD2F35
accent         = #2A72DA
taskbar        = #EAEAEA
taskbar_hover  = #000000 0.06
taskbar_active = #000000 0.08
taskbar_down   = #000000 0.13
taskbar_mark   = #000000 0.50
taskbar_power  = #D93B41
taskbar_edge   = #000000 0.12
shadow_key     = 0.24
shadow_ambient = 0.16
