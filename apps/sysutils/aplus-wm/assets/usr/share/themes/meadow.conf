# meadow: generated by scripts/gen-themes from 03.webp, with its greys tinted towards the
# picture's most colourful hue (Oklch 126°). Run it again rather than editing this file.
#
# Colours are #RRGGBB or #RRGGBBAA, or #RRGGBB followed by an alpha from 0 to 1.
# [ui] and [wm] hold what both variants share; [dark.*] and [light.*] what each sets apart.

[ui]
on_primary     = #FFFFFF
on_danger      = #FFFFFF
disabled_fade  = 0.55
corner_radius  = 8
font_size      = 14
font_regular   = /usr/share/fonts/ttf/NotoSans-Regular.ttf
font_medium    = /usr/share/fonts/ttf/NotoSans-Medium.ttf
font_bold      = /usr/share/fonts/ttf/NotoSans-Bold.ttf
font_mono      = /usr/share/fonts/ttf/JetBrainsMono-Regular.ttf
font_mono_bold = /usr/share/fonts/ttf/JetBrainsMono-Bold.ttf
font_mono_size = 14

[wm]
wallpaper      = /usr/share/images/03.webp
desktop_top    = #B3CBDC
desktop_bottom = #658B50
taskbar_shadow = 0.60
font           = /usr/share/fonts/ttf/NotoSans-Regular.ttf
font_size      = 14

[dark.ui]
background     = #2A2C26
surface        = #33352F
surface_sunken = #1A1D17
primary        = #4D6903
secondary      = #3A3D35
on_secondary   = #EDEFEB
danger         = #C9363C
hover          = #FFFFFF 0.07
active         = #FFFFFF 0.14
border         = #FFFFFF 0.07
focus_ring     = #779F02
text           = #EDEFEB
text_muted     = #A3A69E

[dark.wm]
title_active   = #EDEFEB
title_idle     = #90948C
close_over     = #E5484D
close_down     = #BD3238
accent         = #779F02
taskbar        = #12150F
taskbar_power  = #E5484D
outline        = #000000 0.55
highlight      = #FFFFFF 0.10
highlight_idle = #FFFFFF 0.05
button         = #FFFFFF 0.07
button_over    = #FFFFFF 0.16
button_down    = #FFFFFF 0.24
taskbar_hover  = #FFFFFF 0.07
taskbar_active = #FFFFFF 0.11
taskbar_down   = #FFFFFF 0.16
taskbar_mark   = #999999 0.70
taskbar_edge   = #FFFFFF 0.08
shadow_key     = 0.42
shadow_ambient = 0.30

[light.ui]
background     = #F5F6F2
surface        = #FDFEFC
surface_sunken = #FDFEFC
primary        = #5F7F05
secondary      = #E2E5DE
on_secondary   = #1D1F1A
danger         = #D93B41
hover          = #000000 0.06
active         = #000000 0.10
border         = #000000 0.11
focus_ring     = #5F7F05
text           = #1D1F1A
text_muted     = #676A62

[light.wm]
title_active   = #1D1F1A
title_idle     = #7C7F77
close_over     = #D93B41
close_down     = #BD2F35
accent         = #5F7F05
taskbar        = #E8EBE4
taskbar_power  = #D93B41
outline        = #000000 0.16
highlight      = #FFFFFF 0.85
highlight_idle = #FFFFFF 0.45
button         = #000000 0.05
button_over    = #000000 0.10
button_down    = #000000 0.16
taskbar_hover  = #000000 0.06
taskbar_active = #000000 0.08
taskbar_down   = #000000 0.13
taskbar_mark   = #000000 0.50
taskbar_edge   = #000000 0.12
shadow_key     = 0.24
