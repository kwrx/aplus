# aplus light: white surfaces on a soft grey, near-black text, and a deeper blue accent.
#
# Colours are #RRGGBB or #RRGGBBAA, or #RRGGBB followed by an alpha from 0 to 1.
# Anything left out keeps the built-in value.

[ui]
background     = #F6F6F6
surface        = #FFFFFF
surface_sunken = #FFFFFF
primary        = #2A72DA
on_primary     = #FFFFFF
secondary      = #E4E4E4
on_secondary   = #1D1D1D
danger         = #D93B41
on_danger      = #FFFFFF
hover          = #000000 0.06
active         = #000000 0.10
border         = #000000 0.11
focus_ring     = #2A72DA
text           = #1D1D1D
text_muted     = #6B6B6B
disabled_fade  = 0.55
corner_radius  = 8
font_size      = 14
font_regular   = /usr/share/fonts/ttf/Ubuntu-R.ttf
font_medium    = /usr/share/fonts/ttf/Ubuntu-M.ttf
font_bold      = /usr/share/fonts/ttf/Ubuntu-B.ttf

[wm]
wallpaper      = /usr/share/images/aplus-light.webp
desktop_top    = #A9C4EA
desktop_bottom = #7FA6DA
title_active   = #1D1D1D
title_idle     = #6E6E6E
outline        = #000000 0.16
highlight      = #FFFFFF 0.85
highlight_idle = #FFFFFF 0.45
button         = #000000 0.05
button_over    = #000000 0.10
button_down    = #000000 0.16
close_over     = #D93B41
close_down     = #BD2F35
accent         = #2A72DA
taskbar        = #EAEAEA
taskbar_hover  = #000000 0.06
taskbar_active = #000000 0.08
taskbar_down   = #000000 0.13
taskbar_mark   = #000000 0.50
taskbar_power  = #D93B41
taskbar_edge   = #000000 0.12
shadow_key     = 0.24
shadow_ambient = 0.16
taskbar_shadow = 0.60
font           = /usr/share/fonts/ttf/Ubuntu-M.ttf
font_size      = 14
